<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湧健康 靈芝蟲草益生菌一頁式導購(行銷素材呈現測試版1.0)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --primary-green: #2d4c1e;
            --soft-green: #ccd5ae;
            --warm-beige: #fefae0;
            --earth-brown: #964b00;
            --text-main: #1a240d;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            color: var(--text-main);
            scroll-behavior: smooth;
            margin: 0;
            padding: 0;
            /* 背景底圖渲染 */
            background-image: 
                linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(74, 4, 4, 0.05) 100%), 
                url('https://i.postimg.cc/gkxqZzcj/Gemini-Generated-Image-sabsm3sabsm3sabs.png');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: var(--warm-beige);
        }

        /* 針對熟齡族強化的毛玻璃面板 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-blur: 20px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        @media (min-width: 768px) {
            .glass-panel { border-radius: 3.5rem; }
        }

        /* 內文字體優化：放大但不加粗，提升視覺層次與質感 */
        p, .content-text {
            font-size: 1.4rem !important;
            font-weight: 400 !important; /* 取消加粗 (Regular) */
            line-height: 1.8;
            color: #2d3436;
        }
        
        /* 僅標題類維持加粗 */
        h1, h2, h3, .font-black {
            font-weight: 900 !important;
        }

        /* TOP 主視覺區塊 */
        .new-top-banner {
            position: relative;
            width: 100%;
            height: auto; 
            display: flex;
            align-items: flex-end; 
            justify-content: center;
            overflow: hidden;
            background-color: #faf9f6;
        }
        @media (min-width: 768px) {
            .new-top-banner { height: 60vh; min-height: 480px; }
        }

        .new-top-banner .banner-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain; 
        }
        @media (min-width: 768px) {
            .new-top-banner .banner-img { height: 100%; object-fit: cover; }
        }
        
        /* 標題文字 - 單排且靠底 */
        .banner-overlay-text {
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 10;
            text-align: center;
            color: white;
            width: 100%;
            font-size: clamp(0.9rem, 3.8vw, 2.5rem); 
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 4px 10px rgba(0,0,0,1), 0 0 30px rgba(0,0,0,0.5);
            padding: 10px 10px; 
            letter-spacing: 0.1em;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 100%);
            white-space: nowrap;
        }

        /* [修正] 跑馬燈 - 降速 0.7 倍 (50s) 並縮短循環間距 */
        .marquee-box {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-blur: 10px;
            border-radius: 60px;
            padding: 12px 0;
            overflow: hidden;
            width: 92%;
            max-width: 650px;
            border: 2px solid rgba(150, 75, 0, 0.25);
            margin: 10px auto;
        }
        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            /* 調整為 50s (更慢) 並使用負延遲讓文字一開始就出現 */
            animation: marquee 50s linear infinite;
            animation-delay: -25s; 
            color: var(--earth-brown);
            font-weight: 900;
            font-size: 1.1rem;
        }
        @media (min-width: 768px) {
            .marquee-text { font-size: 1.5rem; }
        }
        /* 調整 Keyframes 以縮短循環間的空白時間至 5 秒內 */
        @keyframes marquee {
            0% { transform: translateX(100%); }
            90% { transform: translateX(-110%); } /* 在 90% 時完成走動 */
            100% { transform: translateX(-110%); } /* 最後 10% 做為極短緩衝 */
        }

        /* 圓形導航 */
        .nav-circle {
            width: 115px; 
            height: 115px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 3px solid #f2f2f2;
            flex-shrink: 0;
        }
        @media (min-width: 768px) {
            .nav-circle { width: 200px; height: 200px; border-width: 6px; } 
        }
        .nav-circle.active {
            background: var(--primary-green);
            color: white !important;
            transform: scale(1.08);
            border-color: var(--primary-green);
            box-shadow: 0 15px 40px rgba(45, 76, 30, 0.25);
        }
        .nav-circle i { font-size: 1.6rem; margin-bottom: 4px; }
        @media (min-width: 768px) {
            .nav-circle i { font-size: 3.2rem; margin-bottom: 12px; }
        }
        .nav-circle span { 
            font-size: 1rem; 
            font-weight: 500; 
            line-height: 1.2; 
            text-align: center; 
        }
        @media (min-width: 768px) {
            .nav-circle span { font-size: 1.45rem; }
        }

        /* 分割線 */
        .section-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 0;
        }
        .section-divider::before, .section-divider::after {
            content: "";
            height: 2px;
            flex: 1;
            background: linear-gradient(to right, transparent, var(--earth-brown), transparent);
            max-width: 150px;
            opacity: 0.2;
        }
        .section-divider i { color: var(--primary-green); font-size: 1rem; margin: 0 15px; opacity: 0.5; }

        /* 懸浮按鈕 */
        .floating-home {
            position: fixed;
            bottom: 25px;
            right: 20px;
            width: 65px;
            height: 65px;
            background: var(--earth-brown);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            z-index: 100;
        }
        @media (min-width: 768px) {
            .floating-home { width: 80px; height: 80px; right: 35px; bottom: 35px; }
        }
        .floating-home i { font-size: 1.8rem; }

        .fade-in { animation: fadeInUp 0.8s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* [修正] 漫畫卡片樣式 - 確保間距顯著且分隔清晰 */
        .manga-card {
            background: white;
            padding: 12px;
            border-radius: 1.5rem;
            box-shadow: 0 15px 45px rgba(0,0,0,0.07);
            border: 1px solid #f2f2f2;
            margin-bottom: 2rem; /* 增加底部間距 */
        }
        @media (min-width: 768px) {
            .manga-card { padding: 20px; border-radius: 2.8rem; margin-bottom: 4rem; }
        }
    </style>
</head>
<body id="home" class="overflow-x-hidden">

    <a href="#home" class="floating-home hover:scale-110 active:scale-95 transition-transform">

    </a>

    <!-- Sticky Nav -->
    <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md px-4 py-3 md:px-10 md:py-4 flex justify-between items-center border-b border-stone-100 shadow-xl">
        <div class="flex items-center">
            <a href="#home" class="flex items-center">
                <img src="https://i.postimg.cc/5NJmcN7t/yong-ling-zhilogo-heng-02-png.webp" alt="湧健康 Logo" class="h-10 md:h-16 w-auto object-contain">
            </a>
        </div>
        <a href="#purchase" class="bg-[#bc6c25] text-white px-6 py-2 md:px-12 md:py-3 rounded-full text-sm md:text-lg font-black shadow-2xl hover:bg-[#a65d1f] transition">立即訂購</a>
    </nav>

    <!-- TOP 主視覺 Banner -->
    <section class="new-top-banner">
        <img src="https://i.postimg.cc/Pr0rLBmn/yi-sheng-jun-zhu-shi-jue-051001.png" class="banner-img" alt="全新主視覺">
        <div class="banner-overlay-text fade-in">

        </div>
    </section>

    <!-- [修正] 跑馬燈 - 文字更新、放回花朵 🌸、速度降至 0.7 倍 -->
    <div class="marquee-box">
        <div class="marquee-text">
            🌸 一份給媽媽的心意，一份全家人的健康守護 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 🌸 一份給媽媽的心意，一份全家人的健康守護 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 🌸 一份給媽媽的心意，一份全家人的健康守護
        </div>
    </div>

    <div class="section-divider"><i class="fa-solid fa-dna"></i></div>

    <!-- Section B: 短影音健康資訊 -->
    <section id="video-section" class="py-6 container mx-auto px-4 md:px-10">
        <div class="max-w-5xl mx-auto glass-panel p-8 md:p-24 text-center">
            <div class="mb-8 md:mb-14">
                <h2 class="text-3xl md:text-5xl font-black text-stone-900 mb-4 tracking-tight">短影音健康資訊</h2>
                <!-- 內文：放大但不加粗 -->
                <p class="text-stone-900 font-normal text-xl md:text-3xl leading-relaxed max-w-3xl mx-auto content-text">
                    兩分多鐘讓您認識，為健康而生的<br class="hidden md:block"> - 湧健康靈芝蟲草益生菌
                </p>
            </div>
            
            <div class="max-w-4xl mx-auto p-2 md:p-4 bg-white rounded-[2rem] md:rounded-[3.5rem] shadow-2xl border-4 md:border-8 border-white">
                <div id="video-container-box" class="rounded-[1.5rem] md:rounded-[3rem] overflow-hidden relative aspect-video bg-stone-100 shadow-inner border border-stone-50">
                    <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center cursor-pointer group" style="background-image: linear-gradient(rgba(0,0,0,0.05), rgba(0,0,0,0.05)), url('https://i.postimg.cc/85677a.jpg'); background-size: cover; background-position: center;" onclick="loadRealVideo()">
                        <div class="w-20 h-20 md:w-28 md:h-24 bg-white/95 backdrop-blur-md rounded-full flex items-center justify-center border-4 border-white group-hover:scale-110 group-hover:bg-[#bc6c25] transition-all shadow-2xl">
                            <i class="fa-solid fa-play text-stone-900 text-3xl md:text-5xl ml-1 md:ml-2 transition-colors group-hover:text-white"></i>
                        </div>
                    </div>
                    <div id="video-player-container" class="hidden w-full h-full"></div>

            </div>

            <div class="mt-8 md:mt-12">
                <a href="https://youtu.be/0w0Oo2IfdQA" target="_blank" class="text-[#bc6c25] text-base md:text-xl font-black border-b-4 border-[#bc6c25] pb-2">
                    <i class="fa-brands fa-youtube mr-3"></i> 若無法播放請點擊開啟
                </a>
            </div>
        </div>
    </section>

    <div class="section-divider"><i class="fa-solid fa-microscope"></i></div>

    <!-- Section C: 圓形互動導覽 -->
    <section id="interactive-content" class="relative z-20 container mx-auto px-4 md:px-10 py-6">
        <div class="flex justify-center gap-2 md:gap-14 flex-nowrap overflow-x-hidden mb-12 md:mb-20">
            <div onclick="scrollToVideo()" id="circle-video" class="nav-circle text-stone-700">
                <i class="fa-solid fa-circle-play"></i>
                <span>短影音<br>資訊</span>
            </div>
            <div onclick="switchSection('comic')" id="circle-comic" class="nav-circle active text-stone-700">
                <i class="fa-solid fa-face-smile"></i>
                <span>漫畫<br>輕鬆看</span>

            <div onclick="switchSection('summary')" id="circle-summary" class="nav-circle text-stone-700">
                <i class="fa-solid fa-book-open"></i>
                <span>一頁<br>懶人包</span>
            </div>
        </div>

        <div class="max-w-6xl mx-auto px-2 md:px-0">
            <div id="display-summary" class="display-content hidden fade-in space-y-10 md:space-y-16">
                <div class="glass-panel p-4 md:p-6 overflow-hidden border-4 md:border-8 border-white shadow-2xl">
                    <img src="https://i.postimg.cc/2S23SGsD/02-zi-xun-tu-biao-01-ling-zhi-chong-cao-yi-sheng-jun-1.png" alt="產品特色" class="w-full h-auto rounded-[1.5rem] md:rounded-[2.5rem]">
                </div>
                <div class="glass-panel p-4 md:p-6 overflow-hidden border-4 md:border-8 border-white shadow-2xl">
                    <img src="https://i.postimg.cc/Gmq9mKW1/02-zi-xun-tu-biao-02-ling-zhi-chong-cao-yi-sheng-jun-1.png" alt="君臣佐使理論" class="w-full h-auto rounded-[1.5rem] md:rounded-[2.5rem]">
                </div>
            </div>

            <!-- [修正] 內容：漫畫輕鬆看 - 確保圖片不黏連，寬度適中 -->
            <div id="display-comic" class="display-content fade-in">
                <div class="flex flex-col items-center gap-12 md:gap-20 max-w-2xl mx-auto">
                    <div class="w-full manga-card">
                        <img src="https://i.postimg.cc/C1VyTTcg/03-man-hua01-ling-zhi-chong-cao-yi-sheng-jun-1280.jpg" class="w-full h-auto rounded-lg md:rounded-2xl">
                    </div>
                    <div class="w-full manga-card">
                        <img src="https://i.postimg.cc/zXPnGT9q/05-EDM-ling-zhi-chong-cao-yi-sheng-jun-04.png" class="w-full h-auto rounded-lg md:rounded-2xl">
                    </div>
                    <div class="w-full manga-card">
                        <img src="https://i.postimg.cc/CL6jxbWV/05-EDM-ling-zhi-chong-cao-yi-sheng-jun-DM-01.png" class="w-full h-auto rounded-lg md:rounded-2xl">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="section-divider"><i class="fa-solid fa-leaf"></i></div>

    <!-- Section D: 轉單區 -->
    <section id="purchase" class="py-12 md:py-20 container mx-auto px-6">
        <div class="max-w-lg mx-auto glass-panel p-10 md:p-16 text-center shadow-2xl relative group overflow-hidden border-4 md:border-8 border-white">
            <h2 class="text-4xl md:text-5xl font-black text-stone-900 mb-4 tracking-tight">專屬優購方案</h2>
            <p class="text-[#2d4c1e] font-black mb-8 md:mb-14 text-sm md:text-lg tracking-[0.5em] uppercase">守護健康 ‧ 即刻行動</p>

            <div class="relative mb-10 md:mb-14">
                <div class="absolute -top-3 -right-3 md:-top-5 md:-right-5 bg-[#bc6c25] text-white w-16 h-16 md:w-24 md:h-24 flex flex-col items-center justify-center rounded-full font-black shadow-2xl border-4 border-white z-20 transform rotate-12 group-hover:rotate-0 transition-transform duration-500">
                    <span class="text-[10px] md:text-xs">數量</span>
                    <span class="text-2xl md:text-4xl">x3</span>
                </div>
                <div class="aspect-square bg-white rounded-3xl flex items-center justify-center overflow-hidden shadow-inner border-2 border-stone-50">
                    <img src="https://i.postimg.cc/TPcc38Kd/yi-sheng-jun-shi-yi-tu-0510.png" alt="專屬優惠組合" class="w-full h-auto drop-shadow-2xl group-hover:scale-105 transition-transform duration-1000">
                </div>
            </div>

            <h3 class="text-2xl md:text-3xl font-black text-stone-900 mb-3">靈芝蟲草益生菌膠囊</h3>
            <!-- 內文：不加粗 -->
            <p class="text-stone-500 font-normal text-xs md:text-base mb-10 md:mb-12 tracking-widest uppercase">全方位健康守護 (3瓶裝)</p>
            
            <div class="space-y-2 mb-10 md:mb-14">
                <div class="text-5xl md:text-7xl font-black text-[#bc6c25] tracking-tighter">$4,500 <span class="text-xl md:text-2xl font-bold text-stone-400">元</span></div>
                <p class="text-stone-400 line-through text-xl md:text-3xl italic font-bold opacity-60">原價 $7,500</p>
            </div>

            <button class="w-full bg-[#1a240d] text-white text-2xl md:text-3xl font-black py-6 md:py-9 rounded-[2rem] md:rounded-[3rem] shadow-2xl hover:bg-[#2d4c1e] transition-all transform active:scale-95 flex items-center justify-center">
                <i class="fa-solid fa-cart-shopping mr-4 md:mr-6"></i> 立即加入購物車
            </button>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-16 md:py-24 bg-[#1a240d] text-stone-500 text-center mt-20 border-t-8 border-[#2d4c1e]">
        <div class="container mx-auto px-10">
            <div class="text-white font-black text-3xl md:text-4xl mb-8 tracking-[0.4em] uppercase text-center">Ogift 湧健康</div>
            <p class="text-xs md:text-lg tracking-[0.5em] opacity-40 uppercase font-black">© 2026 OGIFT AMITOS INC. | 您的健康專家</p>
        </div>
    </footer>

    <script>
        function switchSection(id) {
            document.querySelectorAll('.display-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('display-' + id).classList.remove('hidden');
            document.querySelectorAll('.nav-circle').forEach(el => el.classList.remove('active'));
            const targetId = 'circle-' + id;
            document.getElementById(targetId).classList.add('active');
            document.getElementById('interactive-content').scrollIntoView({ behavior: 'smooth' });
        }

        function scrollToVideo() {
            document.querySelectorAll('.nav-circle').forEach(el => el.classList.remove('active'));
            document.getElementById('circle-video').classList.add('active');
            document.getElementById('video-section').scrollIntoView({ behavior: 'smooth' });
        }

        function loadRealVideo() {
            const container = document.getElementById('video-player-container');
            const placeholder = document.getElementById('video-placeholder');
            container.innerHTML = `<iframe class="w-full h-full rounded-[1.5rem] md:rounded-[2.5rem]" src="https://www.youtube.com/embed/0w0Oo2IfdQA?autoplay=1&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            placeholder.classList.add('hidden');
            container.classList.remove('hidden');
        }
    </script>
</body>
</html>
